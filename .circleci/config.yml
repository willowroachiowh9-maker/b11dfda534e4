version: 2.1

jobs:
  yolo5:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create digest B
          command: |
            mkdir -p /tmp/cell-C
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=0;i<10000;i++) printf "%c", 48+i%10}' > /tmp/cell-C/vector.log; true
            echo "stage: verify"
      - persist_to_workspace:
          root: /tmp/cell-C
          paths:
            - 'vector.log'
  verify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cell-C
      - run:
          name: Fetch prior blob
          command: |
            awk 'FNR==NR{line[NR]=$0;c++;next} FNR<=c && $0==line[FNR]' /tmp/cell-C/vector.log /tmp/cell-C/vector.log 2>/dev/null | wc -l || true
      - run:
          name: Pull dependencies
          command: git clone --depth 3 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch sources
          command: tar -xJ -f stage-logs-release.tar.xz
      - run:
          name: Store metadata
          command: uptime
      - run:
          name: Cooldown
          command: cat /proc/cpuinfo | head -5
      - run:
          command: ./publisher-run && true
